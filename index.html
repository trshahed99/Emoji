<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Telegram Mini App</title>
    <!-- টেলিগ্রামের অফিশিয়াল ওয়েব অ্যাপ স্ক্রিপ্ট -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #05050a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(15, 23, 42, 0.85);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
            text-align: center;
            width: 100%;
            max-width: 360px;
            backdrop-filter: blur(10px);
        }

        h2 {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.5);
            margin-bottom: 5px;
            font-size: 24px;
        }

        p {
            color: #94a3b8;
            font-size: 13px;
        }

        /* প্রোফাইল পিকচার স্টাইল */
        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f;
            object-fit: cover;
            background: #1e293b;
        }

        .user-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: left;
        }

        .user-box p {
            color: #e2e8f0;
            font-size: 14px;
            margin: 8px 0;
        }

        .user-box b {
            color: #00f0ff;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        .btn {
            background: linear-gradient(45deg, #00f0ff, #ff007f);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: 0.3s;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 5px rgba(255, 0, 127, 0.8);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- প্রোফাইল ছবি ও নিয়ন বর্ডার -->
        <div class="avatar-container">
            <img id="userPhoto" class="avatar" src="https://i.ibb.co/5G02wY7/placeholder.png" alt="Profile">
        </div>

        <h2>স্বাগতম! ⚡</h2>
        <p>নিয়ন ডিজাইন মিনি অ্যাপ</p>
        
        <div class="user-box" id="userInfo">
            <p>লোড হচ্ছে...</p>
        </div>

        <button class="btn" onclick="triggerAction()">ফাটফাটি অ্যাকশন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userDiv = document.getElementById('userInfo');
        const userPhotoImg = document.getElementById('userPhoto');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            
            userDiv.innerHTML = `
                <p><b>নাম:</b> ${user.first_name} ${user.last_name || ''}</p>
                <p><b>ইউজারনেম:</b> @${user.username || 'নেই'}</p>
                <p><b>ইউজার আইডি:</b> ${user.id}</p>
            `;

            // যদি টেলিগ্রাম থেকে ইউজারের প্রোফাইল পিকচার লিংক পাওয়া যায়
            if (user.photo_url) {
                userPhotoImg.src = user.photo_url;
            }
        } else {
            userDiv.innerHTML = `
                <p><b>স্ট্যাটাস:</b> ব্রাউজার মোড</p>
                <p style="color: #ff007f;">দয়া করে টেলিগ্রাম বট থেকে ওপেন করুন!</p>
            `;
        }

        function triggerAction() {
            tg.HapticFeedback.impactOccurred('medium'); // টেলিগ্রামের ভাইব্রেশন এফেক্ট
            alert("নিয়ন বাটন সাকসেসফুলি কাজ করছে! 🔥");
        }
    </script>

</body>
</html>
