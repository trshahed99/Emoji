<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Telegram Mini App</title>

    <!-- Telegram WebApp স্ক্রিপ্ট -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ==================================================
           বেসিক রিসেট
           ================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ==================================================
           বডি - নিয়ন ব্যাকগ্রাউন্ড
           ================================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #05050a;
            background-image:
                radial-gradient(circle at 20% 15%, rgba(0, 240, 255, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 80% 85%, rgba(255, 0, 127, 0.10) 0%, transparent 45%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* ==================================================
           মূল কার্ড
           ================================================== */
        .card {
            background: rgba(15, 23, 42, 0.85);
            padding: 30px 22px;
            border-radius: 24px;
            border: 2px solid #00f0ff;
            box-shadow:
                0 0 25px rgba(0, 240, 255, 0.40),
                inset 0 0 20px rgba(0, 240, 255, 0.15);
            text-align: center;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: cardIn 0.6s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ==================================================
           হেডিং
           ================================================== */
        h1 {
            color: #00f0ff;
            text-shadow:
                0 0 10px rgba(0, 240, 255, 0.9),
                0 0 25px rgba(0, 240, 255, 0.5);
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        /* ==================================================
           প্রোফাইল ছবি
           ================================================== */
        .avatar-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            position: relative;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ff007f;
            object-fit: cover;
            background: #1e293b;
            box-shadow:
                0 0 20px #ff007f,
                0 0 45px rgba(255, 0, 127, 0.45);
            animation: pulseAvatar 2.2s ease-in-out infinite;
        }

        @keyframes pulseAvatar {
            0%, 100% {
                box-shadow: 0 0 20px #ff007f, 0 0 45px rgba(255, 0, 127, 0.45);
            }
            50% {
                box-shadow: 0 0 30px #ff007f, 0 0 65px rgba(255, 0, 127, 0.65);
            }
        }

        /* ==================================================
           স্ট্যাটাস টেক্সট
           ================================================== */
        .status {
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            margin-bottom: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online  { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .dot.offline { background: #ff0044; box-shadow: 0 0 10px #ff0044; }
        .dot.loading { background: #ffcc00; box-shadow: 0 0 10px #ffcc00; animation: blink 1s infinite; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ==================================================
           ইউজার ইনফো বক্স
           ================================================== */
        .info-box {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid #ff007f;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.35);
            padding: 16px 18px;
            border-radius: 14px;
            text-align: left;
            margin-bottom: 18px;
        }

        .info-box p {
            color: #e2e8f0;
            font-size: 13.5px;
            margin: 9px 0;
            word-break: break-word;
            line-height: 1.5;
        }

        .info-box b {
            color: #00f0ff;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.55);
        }

        /* ==================================================
           প্রিমিয়াম ব্যাজ
           ================================================== */
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 7px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 6px;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }

        .badge-premium {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            box-shadow: 0 0 12px #ffd700;
        }

        /* ==================================================
           বাটন
           ================================================== */
        .btn {
            background: linear-gradient(45deg, #00f0ff, #ff007f);
            color: #ffffff;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            letter-spacing: 0.6px;
            box-shadow: 0 0 22px rgba(255, 0, 127, 0.6);
            transition: all 0.25s ease;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.9);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ==================================================
           স্পিনার
           ================================================== */
        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-top-color: #00f0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ==================================================
           রিফ্রেশ বাটন
           ================================================== */
        .refresh-btn {
            background: transparent;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 9px 18px;
            border-radius: 9px;
            font-size: 12.5px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
        }

        .refresh-btn:active {
            background: rgba(0, 240, 255, 0.18);
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- প্রোফাইল ছবি -->
        <div class="avatar-wrapper">
            <img id="userPhoto" class="avatar" alt="Profile"
                 src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231e293b'/><circle cx='50' cy='40' r='16' fill='%2300f0ff'/><ellipse cx='50' cy='82' rx='26' ry='18' fill='%2300f0ff'/></svg>">
        </div>

        <!-- হেডিং -->
        <h1>স্বাগতম! ⚡</h1>
        <p class="subtitle">টেলিগ্রাম মিনি অ্যাপ • নিয়ন ডিজাইন</p>

        <!-- স্ট্যাটাস -->
        <div class="status" id="statusText">
            <span class="dot loading"></span>
            <span>সংযোগ করা হচ্ছে...</span>
        </div>

        <!-- ইউজার ইনফো -->
        <div class="info-box" id="userInfo">
            <p><span class="spinner"></span>টেলিগ্রাম থেকে তথ্য আনা হচ্ছে...</p>
        </div>

        <!-- অ্যাকশন বাটন -->
        <button class="btn" id="actionBtn" onclick="triggerAction()" disabled>
            ⚡ ফাটফাটি অ্যাকশন
        </button>

        <!-- রিফ্রেশ বাটন -->
        <button class="refresh-btn" onclick="loadUserInfo()">🔄 রিফ্রেশ</button>

    </div>

    <script>
        // ==================================================
        // টেলিগ্রাম WebApp ইনিশিয়ালাইজ
        // ==================================================
        const tg = window.Telegram.WebApp;

        // ফুল স্ক্রিন মোড
        tg.expand();
        tg.ready();

        // টেলিগ্রাম থিম সেট
        try {
            tg.setHeaderColor('#05050a');
            tg.setBackgroundColor('#05050a');
        } catch (e) { /* পুরনো ভার্সনে কাজ নাও করতে পারে */ }

        // ==================================================
        // DOM এলিমেন্ট
        // ==================================================
        const userInfoDiv = document.getElementById('userInfo');
        const userPhotoImg = document.getElementById('userPhoto');
        const statusText   = document.getElementById('statusText');
        const actionBtn    = document.getElementById('actionBtn');

        // ইউজার ডাটা গ্লোবালি সেভ
        let currentUser = null;

        // ==================================================
        // ডিফল্ট অ্যাভাটার (নামের প্রথম অক্ষর)
        // ==================================================
        function getDefaultAvatar(name) {
            const letter = (name || '?')[0].toUpperCase();
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
                <circle cx='50' cy='50' r='50' fill='%231e293b'/>
                <text x='50' y='68' font-size='46' text-anchor='middle'
                      fill='%2300f0ff' font-family='sans-serif'
                      font-weight='bold'>${letter}</text>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + svg;
        }

        // ==================================================
        // টেলিগ্রাম থেকে ইউজার ইনফো লোড (Backend ছাড়া)
        // ==================================================
        function loadUserInfo() {
            // রিসেট UI
            actionBtn.disabled = true;
            actionBtn.textContent = '⏳ লোড হচ্ছে...';
            statusText.innerHTML = '<span class="dot loading"></span><span>সংযোগ করা হচ্ছে...</span>';
            userInfoDiv.innerHTML = '<p><span class="spinner"></span>টেলিগ্রাম থেকে তথ্য আনা হচ্ছে...</p>';

            // টেলিগ্রাম থেকে ইউজার ডাটা
            const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;

            // টেলিগ্রামের বাইরে খোলা হলে
            if (!tgUser) {
                statusText.innerHTML = '<span class="dot offline"></span><span>ব্রাউজার মোড</span>';
                userInfoDiv.innerHTML = `
                    <p><b>❌ স্ট্যাটাস:</b> টেলিগ্রামের বাইরে</p>
                    <p style="color: #ff007f;">দয়া করে টেলিগ্রাম বট থেকে খুলুন!</p>
                `;
                actionBtn.textContent = '⚡ ফাটফাটি অ্যাকশন';
                return;
            }

            // ইউজার সেভ
            currentUser = tgUser;

            // স্ট্যাটাস আপডেট
            statusText.innerHTML = '<span class="dot online"></span><span>সংযুক্ত ✓</span>';

            // প্রিমিয়াম ব্যাজ
            const premiumBadge = tgUser.is_premium
                ? '<span class="badge badge-premium">⭐ PREMIUM</span>'
                : '';

            // সম্পূর্ণ নাম
            const fullName = [tgUser.first_name, tgUser.last_name]
                                .filter(Boolean).join(' ');

            // ইউজার ইনফো UI-তে দেখাই
            userInfoDiv.innerHTML = `
                <p><b>👤 নাম:</b> ${fullName}${premiumBadge}</p>
                <p><b>🆔 ইউজার আইডি:</b> ${tgUser.id}</p>
                <p><b>📛 ইউজারনেম:</b> @${tgUser.username || 'নেই'}</p>
                <p><b>🌐 ভাষা:</b> ${tgUser.language_code || 'N/A'}</p>
                <p><b>⚡ প্রিমিয়াম:</b> ${tgUser.is_premium ? 'হ্যাঁ' : 'না'}</p>
            `;

            // প্রোফাইল ছবি হ্যান্ডেল
            if (tgUser.photo_url) {
                userPhotoImg.src = tgUser.photo_url;
                userPhotoImg.onerror = () => {
                    userPhotoImg.src = getDefaultAvatar(tgUser.first_name);
                };
            } else {
                userPhotoImg.src = getDefaultAvatar(tgUser.first_name);
            }

            // অ্যাকশন বাটন চালু
            actionBtn.disabled = false;
            actionBtn.textContent = `হ্যালো ${tgUser.first_name}! 🔥`;
        }

        // ==================================================
        // অ্যাকশন বাটন ক্লিক হ্যান্ডলার
        // ==================================================
        function triggerAction() {
            if (!currentUser) return;

            // হ্যাপটিক ফিডব্যাক (ভাইব্রেশন)
            if (tg.HapticFeedback) {
                try {
                    tg.HapticFeedback.impactOccurred('medium');
                } catch (e) { /* ignore */ }
            }

            // টেলিগ্রাম নেটিভ পপআপ
            tg.showPopup({
                title: '⚡ অ্যাকশন সম্পন্ন',
                message:
                    `হ্যালো ${currentUser.first_name}!\n\n` +
                    `আপনার আইডি: ${currentUser.id}\n` +
                    `ইউজারনেম: @${currentUser.username || 'নেই'}\n\n` +
                    `নিয়ন বাটন সাকসেসফুলি কাজ করছে! 🔥`,
                buttons: [{ type: 'ok' }]
            }, (buttonId) => {
                // ইউজার OK চাপলে আরও একটি ফিডব্যাক
                if (tg.HapticFeedback) {
                    try { tg.HapticFeedback.notificationOccurred('success'); }
                    catch (e) {}
                }
            });
        }

        // ==================================================
        // পেজ লোড হওয়ার সাথে সাথে ডাটা আনি
        // ==================================================
        loadUserInfo();

    </script>

</body>
</html>
