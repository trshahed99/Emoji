<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ NeonPy Runner</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
</head>
<body>

<div class="grid-bg"></div>

<header class="neon-header">
  <h1 class="neon-title">⚡ NeonPy Runner</h1>
  <p class="neon-sub">Upload · Edit · Run — No signup, no limits 😎</p>
</header>

<main class="container">

  <section class="panel" id="uploadPanel">
    <h2 class="panel-title">📦 Deploy New Bot</h2>

    <div class="form-row">
      <input type="text" id="projectName" class="neon-input" placeholder="project_name">
      <select id="mainFileSelect" class="neon-input">
        <option value="">Auto-detect main file</option>
      </select>
    </div>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="zipInput" accept=".zip" hidden>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>
      <p>Drag & Drop <span class="neon-text">ZIP</span> or <span class="neon-text">Folder</span></p>
      <div class="btn-row">
        <button class="neon-btn" onclick="document.getElementById('zipInput').click()">📁 ZIP</button>
        <button class="neon-btn" onclick="document.getElementById('folderInput').click()">📂 Folder</button>
      </div>
      <p id="uploadStatus" class="upload-status"></p>
    </div>

    <h3 class="sub-title">📜 requirements.txt</h3>
    <textarea id="reqInput" class="neon-textarea" placeholder="fastapi&#10;requests&#10;python-telegram-bot"></textarea>

    <div class="btn-row">
      <button class="neon-btn big" id="deployBtn">🚀 Deploy</button>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title">🤖 My Bots</h2>
    <div id="projectList" class="project-list">
      <p class="empty">No projects deployed yet.</p>
    </div>
  </section>

  <section class="panel workspace" id="workspace" style="display:none;">
    <div class="workspace-header">
      <h2 class="panel-title" id="wsTitle">📁 Project</h2>
      <div class="btn-row inline">
        <button class="neon-btn small" id="wsStart">▶️ Start</button>
        <button class="neon-btn small" id="wsStop">⏸ Stop</button>
        <button class="neon-btn small" id="wsRestart">🔄 Restart</button>
        <button class="neon-btn small danger" id="wsDelete">🗑 Delete</button>
        <button class="neon-btn small" id="wsClose">✖ Close</button>
      </div>
    </div>

    <div class="workspace-grid">
      <aside class="file-tree">
        <div class="tree-header">🗂 Files</div>
        <ul id="fileTree"></ul>
      </aside>

      <div class="editor-wrap">
        <div class="editor-toolbar">
          <span id="currentFile">—</span>
          <div class="btn-row inline">
            <button class="neon-btn small" id="saveBtn">💾 Save & Restart</button>
            <button class="neon-btn small danger" id="deleteFileBtn">🗑 Delete File</button>
          </div>
        </div>
        <div id="editor" class="editor"></div>
      </div>

      <div class="console-wrap">
        <div class="console-header">
          🖥 Live Logs
          <button class="neon-btn tiny" id="refreshLogs">🔄 Refresh</button>
          <button class="neon-btn tiny" id="clearLogs">🧹 Clear</button>
        </div>
        <pre id="console" class="console">Select a project to view logs...</pre>
      </div>
    </div>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
          </html>
